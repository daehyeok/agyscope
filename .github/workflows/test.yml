name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests/py -t tests/py -v

  lua:
    name: lua ${{ matrix.lua }}
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1.5", "luajit-2.1"]   # Rex runs Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: ${{ matrix.lua }}
      - name: Lua tests
        run: sh tests/run_all.sh lua

  lint:
    name: pre-commit (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "2.6.0"
          args: --version
      - name: Install pre-commit
        run: |
          pipx install pre-commit==4.3.0
          shellcheck --version
      - name: pre-commit
        env:
          REQUIRE_LINT_TOOLS: "1"
          SKIP: tests # the python and lua jobs run them
        run: pre-commit run --all-files --show-diff-on-failure
